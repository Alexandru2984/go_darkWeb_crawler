# Onion Spider over its Tor hidden service.
#
# The live copy is /etc/nginx/sites-enabled/onion_spider_onion. Tor maps
# HiddenServicePort 80 -> 127.0.0.1:8122 (see deploy/tor/README.md), so this
# server block is reachable only from the local Tor daemon, never from the
# public internet.
#
# WHY THIS EXISTS
#
# The clearnet vhost (go.micutu.com) is proxied through Cloudflare, which
# terminates TLS. Cloudflare therefore sees every request in plaintext:
# credentials, search terms, and the .onion addresses an account is crawling.
# No amount of application hardening changes that — it is a property of where
# the TLS connection ends. This vhost is the way out: over the hidden service
# there is no CDN and no exit node, Tor's encryption runs end to end, and the
# .onion address is itself the service's public key, so identity is established
# without a certificate authority.
#
# Both vhosts serve the same app from the same origin data. This one is for
# people who would rather not have a third party in the path.

server {
    listen 127.0.0.1:8122;
    server_name hgu2gun5cy23bdlwcyihuhvazijrmxhonhqubcdptubdrttjkcaaoeyd.onion;

    # No TLS and deliberately no HSTS. Tor already provides transport
    # encryption and endpoint authentication; HSTS is meaningless for a .onion
    # and pinning it would only create a rule the browser cannot satisfy.
    server_tokens off;

    # PRIVACY: no request logging at all on this vhost. A hidden service that
    # writes an access log defeats a good part of why someone chose it — and
    # the log would be of onion visitors specifically, which is precisely the
    # set of users who asked not to be recorded. Errors still surface in
    # error_log without per-request client detail.
    access_log off;

    include snippets/block-dotfiles.conf;

    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Same policy as clearnet minus upgrade-insecure-requests: there is no
    # https origin to upgrade to here, and the directive would break every
    # request the page makes to itself.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'self'" always;

    location / {
        root /home/micu/go/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location = /reset-password {
        root /home/micu/go/frontend/dist;
        try_files /index.html =404;
    }

    # Registration is closed server-side (ALLOW_REGISTRATION=false), but refuse
    # it here as well. Every onion visitor shares one rate-limit bucket (see
    # below), so if registration is ever reopened this vhost would be the
    # cheapest place to farm accounts, and an emailed verification link is
    # useless to someone who came here to avoid identifying themselves.
    location = /api/auth/register { return 404; }

    location /api/export {
        client_max_body_size 10k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    location /api/ {
        client_max_body_size 10k;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;

        # X-Real-IP is pinned to loopback, and pinning it is mandatory rather
        # than cosmetic. A hidden service connection arrives from the local Tor
        # daemon, so there is no client IP to learn in the first place — but if
        # these headers were not set explicitly, a visitor could supply their
        # own X-Real-IP and the backend (which trusts the header from a
        # loopback peer) would take it at face value, letting them forge
        # rate-limit identity and audit-log attribution.
        #
        # The tradeoff, accepted deliberately: every onion visitor shares one
        # per-IP rate-limit bucket and one lockout counter. Account lockout and
        # the per-recipient email caps are keyed on the email address, not the
        # IP, so those still work per-user.
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;

        # Plain http, so the backend omits the Secure attribute on the session
        # cookie. Not all Tor clients treat .onion as a secure context, and a
        # Secure cookie on an origin the browser considers insecure is silently
        # dropped — which would look like login succeeding and then not. The
        # cookie keeps HttpOnly and SameSite=Strict, and the transport is
        # encrypted by Tor regardless.
        proxy_set_header X-Forwarded-Proto http;
    }
}
