# Production nginx site config for go.micutu.com (Onion Spider).
#
# This file is version-controlled here as the source of truth; the live copy
# lives at /etc/nginx/sites-enabled/onion_spider. See deploy/nginx/README.md
# for how to apply it.
#
# Changes vs. the previous live config:
#   1. Includes snippets/cloudflare-realip.conf so per-IP rate limiting, login
#      lockout and the audit log see the real client IP, not the Cloudflare
#      edge IP. (Only relevant when the orange cloud / CF proxy is enabled.)
#   2. CSP is back to 'self' for scripts and connections. The analytics host
#      allowance was removed along with the tracker itself (see frontend/
#      index.html) — the page now loads no third-party origin at all, so the
#      policy has no exceptions left to carry.

server {
    server_name go.micutu.com;

    # Restore real client IP when behind Cloudflare (no-op if CF proxy is off).
    include snippets/cloudflare-realip.conf;

    # Defense in depth around the CDN/WAF boundary. The variable is computed
    # from the original TCP peer by conf.d/cloudflare-origin-guard.conf; direct
    # requests to the VPS therefore cannot bypass Cloudflare policy by sending
    # this Host header themselves. Loopback remains allowed for local checks.
    if ($from_cloudflare_origin = 0) {
        return 444;
    }

    include snippets/block-dotfiles.conf;

    # Privacy boundary: Prometheus already provides aggregate request metrics.
    # An nginx access log would additionally retain client IPs, search terms and
    # queried .onion URLs, creating a browsing-history dataset we do not need.
    access_log off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # vis-network needs runtime style attributes for graph positioning, but it
    # does not need inline <style> elements. CSP3 separates those two cases so
    # an HTML injection cannot introduce an arbitrary stylesheet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Hide nginx version
    server_tokens off;

    # Vue build output
    location / {
        root /home/micu/go/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Password-reset links include a token in the query string. Serve the SPA
    # entry point without access logging so reset tokens do not land in nginx logs.
    location = /reset-password {
        access_log off;
        root /home/micu/go/frontend/dist;
        try_files /index.html =404;
    }

    # Export streaming — extended timeout, small body cap
    location /api/export {
        client_max_body_size 10k;
        # Stream sensitive exports directly; nginx must not spool a plaintext
        # copy to its proxy temp directory while the client downloads it.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    # Email verification — do NOT log the query string (it contains the token).
    location = /api/auth/verify {
        access_log off;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Go API
    location /api/ {
        client_max_body_size 10k;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    include snippets/robots.conf;
    ssl_certificate /etc/letsencrypt/live/go.micutu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/go.micutu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($from_cloudflare_origin = 0) {
        return 444;
    }

    if ($host = go.micutu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name go.micutu.com;
    return 404; # managed by Certbot
}
