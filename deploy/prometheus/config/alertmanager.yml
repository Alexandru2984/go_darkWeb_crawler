global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.resend.com:587
  smtp_from: 'Onion Spider <noreply@micutu.com>'
  smtp_auth_username: resend
  smtp_auth_password_file: /run/secrets/smtp-password
  smtp_require_tls: true

route:
  receiver: operator-email
  group_by: [service, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    # Local webhook probes install an exact-match route above this fallback.
    # Their still-active alerts must never become email after probe cleanup.
    - receiver: local-tests-only
      matchers: ['alertname=~"OnionSpiderMonitoringPipelineTest.*"']

receivers:
  - name: local-tests-only
  - name: operator-email
    email_configs:
      - to: 984.alexmihai@proton.me
        send_resolved: false
        headers:
          Subject: '[Onion Spider] {{ .Status }}: {{ .CommonLabels.alertname }}'
