# Alert rules for Onion Spider.
#
# Install (prometheus.yml is host-wide and shared, so this is referenced from
# there rather than deployed over it):
#
#   sudo cp deploy/prometheus/onion-spider-rules.yml /etc/prometheus/
#   # ensure prometheus.yml has:
#   #   rule_files:
#   #     - "onion-spider-rules.yml"
#   sudo promtool check rules /etc/prometheus/onion-spider-rules.yml
#   sudo systemctl reload prometheus
#
# These exist because of a specific failure: between 2026-05-05 and 2026-07-20
# the crawler did no work at all. Every node ended in 'failed', nothing was left
# pending, and the service sat idle for over two months without anyone noticing.
# Nothing was wrong that a health check could see — the process was up, the
# database answered, the API returned 200. The only visible symptom was a metric
# nobody was collecting.
#
# So the rules below deliberately alert on *absence of work*, not on liveness.

groups:
  - name: onion-spider
    rules:
      # The exact signature of the two-month stall: no work queued, while a pile
      # of nodes sits in the terminal 'failed' state. The revive sweeper should
      # now prevent this from persisting, so if it fires the sweeper itself is
      # broken or not running.
      - alert: OnionSpiderQueueStalled
        expr: |
          onionspider_queue_nodes{status="pending"} == 0
          and onionspider_queue_nodes{status="failed"} > 100
        for: 2h
        labels:
          severity: critical
          service: onion-spider
        annotations:
          summary: "Crawl queue is empty while {{ $value }} nodes sit failed"
          description: >
            Nothing is pending but failures have accumulated, so the crawler has
            nothing to do and will stay idle. This is the state the service was
            in, undetected, from May to July 2026. Check that the revive sweeper
            is running: journalctl -u onion-spider -g 'revived failed nodes'.

      # Work is queued but nothing is completing. Catches wedged workers, a dead
      # Tor daemon, or a crawl loop that claims nodes and never finishes them —
      # none of which affect /healthz or /readyz.
      - alert: OnionSpiderNotCrawling
        expr: |
          rate(onionspider_crawls_total[30m]) == 0
          and onionspider_queue_nodes{status="pending"} > 0
        for: 1h
        labels:
          severity: critical
          service: onion-spider
        annotations:
          summary: "Nodes are queued but no crawl has completed in 30m"
          description: >
            Work is available and workers are producing no results. Usually Tor:
            check `systemctl status tor@default` and the scrape_error rate.

      # Sustained failures point at the transport (Tor down, circuits failing)
      # rather than at individual sites being gone.
      - alert: OnionSpiderHighFailureRate
        expr: |
          sum(rate(onionspider_crawls_total{result="scrape_error"}[1h]))
          /
          clamp_min(sum(rate(onionspider_crawls_total[1h])), 0.001)
          > 0.8
        for: 1h
        labels:
          severity: warning
          service: onion-spider
        annotations:
          summary: "Over 80% of crawls are failing"
          description: >
            A high sustained error ratio is normally Tor connectivity, not the
            crawled sites. Left alone long enough, every node exhausts its retry
            budget and the whole queue goes terminal.

      - alert: OnionSpiderDown
        expr: up{job="onion-spider"} == 0
        for: 5m
        labels:
          severity: critical
          service: onion-spider
        annotations:
          summary: "Onion Spider API is not responding to scrapes"

  - name: host
    rules:
      # Disk is the failure that takes the database with it: Postgres stops
      # accepting writes when it cannot extend a file, and the crawler, the API
      # and the backups all fail together. Warn with enough headroom to act.
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
          < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% disk free on /"
          description: >
            Postgres stops accepting writes on a full disk. Was at 83% used when
            these rules were written, so the margin here is not large.

      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
          < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% disk free on / — database at risk"
