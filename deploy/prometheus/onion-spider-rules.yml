groups:
  - name: onion-spider
    rules:
      - alert: OnionSpiderDown
        expr: up{job="onion-spider"} == 0 or absent(up{job="onion-spider"})
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Onion Spider API is not responding to scrapes
          description: Check onion-spider.service and its loopback metrics endpoint.

      - alert: OnionSpiderDatabaseUnavailable
        expr: |
          onionspider_api_ready{job="onion-spider-backups"} == 0
          and on(service) up{job="onion-spider"} == 1
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Onion Spider readiness check is failing
          description: The API metrics endpoint responds while readiness fails. Check PostgreSQL connectivity.

      - alert: OnionSpiderQueueStalled
        expr: |
          (
            onionspider_crawl_failed_nodes{job="onion-spider"}
            or on(job,instance)
            onionspider_queue_nodes{job="onion-spider",status="failed"}
          ) > 100
          and on(job,instance)
          (
            onionspider_crawl_ready_nodes{job="onion-spider"}
            or on(job,instance)
            sum by(job,instance) (
              onionspider_queue_nodes{job="onion-spider",status=~"pending|crawling"}
            )
          ) == 0
        for: 2h
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: 'Crawl queue is empty while {{ $value }} nodes sit failed'
          description: Check the failed-node revival sweeper and Tor connectivity.

      - alert: OnionSpiderNotCrawling
        expr: |
          (
            sum by(job,instance,service) (
              increase(onionspider_crawls_total{job="onion-spider",result="success"}[30m])
            )
            or on(job,instance)
            0 * sum by(job,instance,service) (
              onionspider_queue_nodes{job="onion-spider",status=~"pending|crawling"}
            )
          ) == 0
          and on(job,instance)
          (
            onionspider_crawl_ready_nodes{job="onion-spider"}
            or on(job,instance)
            sum by(job,instance,service) (
              onionspider_queue_nodes{job="onion-spider",status=~"pending|crawling"}
            )
          ) > 0
        for: 1h
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Crawl work is available without successful completions
          description: Check worker activity and Tor connectivity.

      - alert: OnionSpiderHighFailureRate
        expr: |
          sum by(job,instance,service) (
            rate(onionspider_crawls_total{job="onion-spider",result="scrape_error"}[1h])
          )
          /
          clamp_min(sum by(job,instance,service) (
            rate(onionspider_crawls_total{job="onion-spider"}[1h])
          ), 0.001) > 0.8
        for: 1h
        labels: { severity: warning, service: onion-spider }
        annotations:
          summary: Over 80% of crawl attempts are failing
          description: Check Tor connectivity and recent crawler errors.

      - alert: OnionSpiderQueueMetricsStale
        expr: |
          (
            time() - onionspider_queue_last_refresh_timestamp_seconds{job="onion-spider"} > 180
            or
            up{job="onion-spider"} == 1
            unless on(job,instance)
            onionspider_queue_last_refresh_timestamp_seconds{job="onion-spider"}
          )
          and on(job,instance) up{job="onion-spider"} == 1
        for: 5m
        labels: { severity: warning, service: onion-spider }
        annotations:
          summary: Queue metrics are missing or stale
          description: Check the queue-depth refresh query and database locks.

  - name: onion-spider-recovery
    rules:
      - alert: OnionSpiderBackupMetricsUnavailable
        expr: up{job="onion-spider-backups"} == 0 or absent(up{job="onion-spider-backups"})
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Backup monitoring endpoint is unavailable
          description: Check onion-spider-monitoring-exporter.service and the metrics credential.

      - alert: OnionSpiderBackupStateInvalid
        expr: onionspider_backup_state_valid{job="onion-spider-backups"} == 0
        for: 10m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Backup verification state is missing or invalid
          description: Check the offsite and restore success records and recent job results.

      - alert: OnionSpiderOffsiteBackupStale
        expr: |
          time() - onionspider_backup_last_success_timestamp_seconds{job="onion-spider-backups",kind="offsite"} > 26 * 3600
          and on(job,instance,kind)
          onionspider_backup_state_valid{job="onion-spider-backups",kind="offsite"} == 1
        for: 10m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: No verified Google Drive backup in over 26 hours
          description: Check onion-spider-backup.service and rclone authorization.

      - alert: OnionSpiderRestoreCheckStale
        expr: |
          time() - onionspider_backup_last_success_timestamp_seconds{job="onion-spider-backups",kind="restore"} > 40 * 24 * 3600
          and on(job,instance,kind)
          onionspider_backup_state_valid{job="onion-spider-backups",kind="restore"} == 1
        for: 10m
        labels: { severity: warning, service: onion-spider }
        annotations:
          summary: No successful isolated restore in over 40 days
          description: Check onion-spider-restore-check.timer and its latest service result.

      - alert: OnionSpiderRecoveryJobFailed
        expr: onionspider_backup_unit_failed{job="onion-spider-backups"} == 1
        for: 2m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: An Onion Spider recovery job has failed
          description: Inspect the failed backup or restore service in the systemd journal.

      - alert: OnionSpiderRecoveryTimerDisabled
        expr: onionspider_backup_timer_enabled{job="onion-spider-backups"} == 0
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: An Onion Spider recovery timer is inactive or disabled
          description: Enable and start the backup and restore-check timers.

      - alert: OnionSpiderRecoveryUnitsUnreadable
        expr: onionspider_backup_units_readable{job="onion-spider-backups"} == 0
        for: 5m
        labels: { severity: warning, service: onion-spider }
        annotations:
          summary: Backup monitoring cannot read the expected systemd units
          description: Check unit installation and the collector sandbox.

      - alert: OnionSpiderDiskSpaceLow
        expr: onionspider_host_disk_available_bytes / onionspider_host_disk_size_bytes < 0.10
        for: 30m
        labels: { severity: warning, service: onion-spider }
        annotations:
          summary: Less than 10% disk space is available on the host filesystem
          description: Check PostgreSQL, local backups and monitoring retention.

      - alert: OnionSpiderDiskSpaceCritical
        expr: onionspider_host_disk_available_bytes / onionspider_host_disk_size_bytes < 0.05
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Less than 5% disk space is available on the host filesystem
          description: Free space before PostgreSQL or backups exhaust the filesystem.

      - alert: OnionSpiderAlertmanagerDown
        expr: up{job="onion-spider-alertmanager"} == 0 or absent(up{job="onion-spider-alertmanager"})
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Onion Spider Alertmanager is unavailable
          description: Check the dedicated Alertmanager container and its logs.

      - alert: OnionSpiderNotificationFailed
        expr: |
          sum(increase(alertmanager_notifications_failed_total{job="onion-spider-alertmanager",integration="email"}[10m])) > 0
        for: 5m
        labels: { severity: critical, service: onion-spider }
        annotations:
          summary: Onion Spider email notifications are failing
          description: Check SMTP credentials, TLS and provider delivery status.
