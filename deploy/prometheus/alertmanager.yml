# Alertmanager routing for this host.
#
# Install (host-wide, shared — see deploy/prometheus/README.md):
#   sudo cp deploy/prometheus/alertmanager.yml /etc/prometheus/alertmanager.yml
#   sudo promtool check config /etc/prometheus/prometheus.yml
#   sudo systemctl restart prometheus-alertmanager
#
# The SMTP password is NOT in this file — it is read from
# /etc/prometheus/alertmanager-smtp.pass (root:prometheus, 0640) so this config
# stays safe to commit.
#
# Why this exists: Prometheus was already pointed at localhost:9093 with nothing
# listening, and no rules were loaded at all. Alerts that fire into a web UI
# nobody opens are worth roughly nothing — the crawler stall of May-July 2026
# went unnoticed for over two months precisely because no signal ever left the
# machine. Email is the channel that actually reaches a person here.

global:
  resolve_timeout: 5m
  smtp_smarthost: 'mail.micutu.com:587'
  smtp_from: 'noreply@micutu.com'
  smtp_auth_username: 'noreply@micutu.com'
  smtp_auth_password_file: '/etc/prometheus/alertmanager-smtp.pass'
  smtp_require_tls: true

route:
  receiver: 'email'
  # Wait briefly before sending so a burst of related alerts arrives as one mail
  # rather than a dozen.
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  # Re-send an unresolved alert once a day. Long enough not to become noise that
  # gets filtered away, often enough that a problem cannot be forgotten — which
  # is the failure mode being corrected here.
  repeat_interval: 24h

  routes:
    # Critical alerts skip most of the batching delay.
    - matchers:
        - severity = "critical"
      receiver: 'email'
      group_wait: 10s
      repeat_interval: 6h

receivers:
  - name: 'email'
    email_configs:
      - to: 'postmaster@micutu.com'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Alert:       {{ .Labels.alertname }}
          Severity:    {{ .Labels.severity }}
          Service:     {{ .Labels.service }}
          Summary:     {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Started:     {{ .StartsAt }}
          {{ end }}

inhibit_rules:
  # A service that is down will also stop crawling and drain its queue; do not
  # send three mails describing one outage.
  - source_matchers:
      - alertname = "OnionSpiderDown"
    target_matchers:
      - service = "onion-spider"
    equal: ['service']

  - source_matchers:
      - alertname = "DiskSpaceCritical"
    target_matchers:
      - alertname = "DiskSpaceLow"
