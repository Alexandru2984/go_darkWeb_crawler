name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs (e.g. quick PR pushes) so we don't waste compute.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret history (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot prove that an older commit never contained
          # a live credential.
          fetch-depth: 0

      - name: Download checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan application history
        run: |
          "${RUNNER_TEMP}/gitleaks" git \
            --no-banner \
            --redact=100 \
            --timeout=180 \
            --max-decode-depth=3 \
            --max-archive-depth=1 \
            --max-target-megabytes=25 \
            --log-opts="--all -- . :!pkg/**" \
            .

  go:
    name: Backend (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.12']
    defaults:
      run:
        working-directory: backend
    # Throwaway Postgres so the DB/API integration tests (gated on
    # TEST_DATABASE_URL) actually run in CI instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: onion_spider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/onion_spider_test?sslmode=disable
        run: go test -race -timeout 5m ./...

      - name: go build
        run: go build -ldflags="-s -w" -trimpath -o /tmp/onion-spider-api ./cmd/api

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false  # the lint action manages its own cache

      - name: golangci-lint
        # golangci-lint-action@v7+ is required for golangci-lint v2.x. v6
        # rejects v2 versions with an explicit error.
        # The lint binary must be built with a Go version >= the toolchain
        # required by go.mod (currently 1.25); v2.1.6 was built with Go 1.24
        # and fails with "the Go language version (go1.24) used to build
        # golangci-lint is lower than the targeted Go version (1.25.0)".
        # v2.4.0 was the first v2 release built with Go 1.25; we pin to a
        # known-stable patch above that.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test:unit

      - name: npm run build
        run: npm run build

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          - image: frontend
            context: ./frontend
          - image: tor
            context: ./deploy/tor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          tags: onion-spider-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
